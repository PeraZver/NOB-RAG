<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOB RAG Library</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="eyebrow">Local RAG</div>
        <h1>NOB Library</h1>
        <p>Pick an indexed book, then chat with its contents.</p>
      </div>

      <div class="sidebar-section">
        <div class="book-header">
          <label for="book-search">Books</label>
          <div class="book-search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/>
              <path d="M15 15l6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <input id="book-search" class="book-search" type="search" placeholder="Search books" autocomplete="off">
          </div>
        </div>
        <div id="book-list" class="book-list" aria-live="polite"></div>
      </div>

    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <div>
          <div class="eyebrow">Browser Interface</div>
          <h2 id="active-book-title">Choose a book</h2>
        </div>
        <div class="header-actions">
          <button id="map-toggle" type="button" class="map-toggle">Map</button>
          <div id="status-pill" class="status-pill">Idle</div>
        </div>
      </header>

      <section id="map-view" class="map-view" hidden>
        <div id="map" class="map"></div>
        <div id="map-message" class="map-message" hidden></div>
      </section>

      <section id="chat-log" class="chat-log">
        <article class="message assistant intro-card">
          <div class="message-role">Assistant</div>
          <div class="message-body">
            Ask a question about the selected book. Answers stay grounded in retrieved chunks and include page-aware source summaries.
          </div>
        </article>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="question-input"
          rows="3"
          placeholder="Ask about formation, commanders, campaigns, dates, places..."
          required
        ></textarea>
        <div class="composer-bar">
          <div id="composer-meta" class="composer-meta">No book selected</div>
          <button id="send-button" type="submit">Send</button>
        </div>
      </form>
    </main>

    <aside class="settings-panel">
      <div class="eyebrow">Settings</div>

      <div id="map-settings" class="sidebar-section map-settings" hidden>
        <label>Campaign data</label>
        <label class="radio-row"><input type="radio" name="campaign-variant" value="default" checked> Default</label>
        <label class="radio-row"><input type="radio" name="campaign-variant" value="grouped"> Grouped</label>
        <label class="radio-row"><input type="radio" name="campaign-variant" value="verified"> Verified</label>
      </div>

      <div class="sidebar-section">
        <label for="provider-select">Provider</label>
        <select id="provider-select">
          <option value="anthropic">Anthropic</option>
          <option value="openai">OpenAI</option>
        </select>
      </div>

      <div class="sidebar-section">
        <label for="profile-select">Speed</label>
        <select id="profile-select">
          <option value="fast">Fast</option>
          <option value="default">Default</option>
          <option value="deep">Deep</option>
        </select>
      </div>

      <div class="sidebar-section checkbox-row">
        <label for="retrieve-only">Retrieve only</label>
        <input id="retrieve-only" type="checkbox">
      </div>
    </aside>
  </div>

  <template id="message-template">
    <article class="message">
      <div class="message-role"></div>
      <div class="message-body"></div>
    </article>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
